<body style="width: 100%;height: 100%; overflow-y: scroll;">
  <div style="width: 100%;height: 100px; background-color: aqua;">过度页面1</div>
  <button id="clickPoint">自定义事件</button>
</body>

<script>
  window._to = {
    server: 'https://mdap.mpaas.cn-hangzhou.aliyuncs.com/loggw/webLog.do',// 必填，埋点的服务地址，地址是客户端配置文件的logGW+/loggw/webLog.do
    appId: 'ONEXDF259A2051016', // 必填，App 唯一标识
    workspaceId: 'shaojian', // 必填，环境标识

<script src="https://gw.alipayobjects.com/render/p/yuyan_npm/@alipay_mpaas-mtracker/1.2.2/dist/index.min.js"></script>
<script>

  document.addEventListener("DOMContentLoaded",function(){
    customPoint()
  })
  function customPoint() {
    alert("11111")
    var currentUrl = window.location.href;
    var clickPoint = document.getElementById('clickPoint');

    clickPoint.addEventListener('click', function () {
      window.Tracker.click('h5EventId', {
        bizType: 'bizType', ext: {
          h5_key: '属性值1',
          h5_key1: '属性值2',
          h5_key2: '属性值3'
        }
      })
    });
  }

</script>
