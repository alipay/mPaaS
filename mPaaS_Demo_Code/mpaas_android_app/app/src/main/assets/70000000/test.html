<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="stylesheet" href="./common.css">
  <title>Document</title>
</head>

<body style="width: 100%;height: 100%; overflow-y: scroll;">
<div style="width: 100%;height: 100px; background-color: aqua;">过度页面1</div>
<button id="go2">go2</button>
<button id="mySetSessionData">setSessionData</button>
<button id="myGetSessionData">getSessionData</button>
<button id="J_BACK_RESULT">返回携带参数</button>
<img src="https://11.164.247.99/mcube/PRI95CCE11211247_default/2.0.0/test.png" style="width: 300px;height: 150px;">
</body>
<script>
  function ready(callback) {
      var currentUrl = window.location.href;
      // alert(currentUrl);
      // 如果 jsbridge 已经注入则直接调用
      if (window.AlipayJSBridge) {
          callback && callback();
      } else {
          // 如果没有注入则监听注入的事件
          document.addEventListener('AlipayJSBridgeReady', callback, false);
      }
  }
  ready(function () {
      var currentUrl = window.location.href;
      var go2 = document.getElementById('go2');
      var mySetSessionData = document.getElementById('mySetSessionData');
      var myGetSessionData = document.getElementById('myGetSessionData');
      var J_BACK_RESULT = document.getElementById('J_BACK_RESULT');

      document.addEventListener('resume',
          function (e) {
              alert(`触发resume==${JSON.stringify(e)}`);
          }, false);

      mySetSessionData.addEventListener('click', function () {
          AlipayJSBridge.call('setSessionData', {
              data: {
                  passData: {
                      key1: {
                          "url": "测试setSessionData1",
                          "showTitleBar": "测试setSessionData2",
                          "showToolBar": "测试setSessionData3"
                      },
                      key2: "测试setSessionData4"
                  }, function(res) {
                      alert(JSON.stringify(res))
                  }
              }
          });
      });
      myGetSessionData.addEventListener('click', function () {
          AlipayJSBridge.call('getSessionData',
              {
                  keys: ['passData']
              },
              function (res) {
                  alert(JSON.stringify(res))
              });
      });
      go2.addEventListener('click', function () {
          AlipayJSBridge.call('pushWindow', {
              url: './test2.html?username=张三&age=test28',
              passData: {
                  key1: {
                      "url": "/www/index.html",
                      "showTitleBar": "自定义参数0",
                      "showToolBar": "自定义参数1"
                  },
                  key2: "自定义参数2"
              }
          });
      });
      J_BACK_RESULT.addEventListener('click', function () {
          alert('返回')
          AlipayJSBridge.call('popWindow');
      });
  })
</script>
<style>
  body {
      font-family: PingFang SC, "苹方", "PingFangSC-Regular", "Helvetica Neue", Helvetica, STHeiTi, sans-serif;
      /* font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; */
      font-size: 15px;
      -moz-user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -khtml-user-select: none;
      user-select: none;
      color: #676767;
      background-color: #f8f8f8;
      font-weight: 600;
  }
</style>

</html>
